name: Deploy radar
on:
  push:
    branches: [main]
    paths: ['site/**', 'engine/lib/**', 'package*.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx wrangler d1 migrations apply antist-radar-ledger --remote
        working-directory: site
      - run: npx wrangler deploy
        working-directory: site
      # The API token lacks zone-level Workers Routes; attach the custom domain
      # through the account-level endpoint instead. Idempotent PUT.
      - name: Ensure custom domain
        run: |
          curl -sS --fail-with-body -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"environment":"production","hostname":"radar.antist.ai","service":"antist-radar","zone_id":"3da215826a4e9241886afd41e2bd9b87"}'
