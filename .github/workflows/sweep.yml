name: Hourly radar sweep
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_PROVIDER: opencode
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # Final-attempt fallback: a sibling model on the same Go plan. A canned
      # refusal comes from a bad backend, so a different model escapes it, and
      # it needs no second key (the old MiniMax fallback ran out of credits).
      RADAR_LLM_FALLBACK_PROVIDER: opencode
      RADAR_LLM_FALLBACK_MODEL: glm-5.3-flash
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      XTWITTER_API_KEY: ${{ secrets.XTWITTER_API_KEY }}
      RADAR_INGEST_TOKEN: ${{ secrets.RADAR_INGEST_TOKEN }}
      GH_READ_TOKEN: ${{ github.token }}
      SOURCE_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The decision state lives in R2 now (state/decision-state.json), pushed and
      # pulled through the Worker. The old actions/cache of the local file was
      # left behind: it was keyed by run_id, so every sweep wrote a new ~10KB
      # entry that no later run could ever restore.
      - run: npm test
      - run: node scripts/radar.mjs --push
        working-directory: engine
