name: Hourly radar sweep
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Primary analysis model: DeepSeek V4.1 Flash on OpenCode Go. On the real
      # scoring prompt it is the fastest (avg 25s vs MiniMax M3's 59s on 32
      # candidates) and covered every candidate in 4/4 runs.
      LLM_PROVIDER: opencode
      LLM_MODEL: deepseek-v4.1-flash
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      # LLM_API_KEY carries the MiniMax key; the fallback below reads it.
      LLM_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      # A different VENDOR on purpose: the outage this guards against is OpenCode
      # Go itself (quota, or the canned-refusal window), which a sibling model on
      # the same plan would not survive.
      RADAR_LLM_FALLBACK_PROVIDER: minimax
      RADAR_LLM_FALLBACK_MODEL: MiniMax-M3
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      XTWITTER_API_KEY: ${{ secrets.XTWITTER_API_KEY }}
      RADAR_INGEST_TOKEN: ${{ secrets.RADAR_INGEST_TOKEN }}
      GH_READ_TOKEN: ${{ github.token }}
      SOURCE_TIMEOUT_MS: '45000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The decision state lives in R2 now (state/decision-state.json), pushed and
      # pulled through the Worker. The old actions/cache of the local file was
      # left behind: it was keyed by run_id, so every sweep wrote a new ~10KB
      # entry that no later run could ever restore.
      - run: npm test
      - run: node scripts/radar.mjs --push
        working-directory: engine
